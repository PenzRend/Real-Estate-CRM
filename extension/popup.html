<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --ink: #0b1619;
        --muted: #676767;
        --border: #dadada;
        --surface: #f6f7f7;
        --accent: #3d6ff2;
        --danger: #c0352b;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        font: 14px/1.45 system-ui, sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 12px;
        color: var(--muted);
      }
      button {
        width: 100%;
        height: 38px;
        border: 0;
        border-radius: 999px;
        background: #1b1b1b;
        color: #fff;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button.link {
        height: auto;
        margin-top: 8px;
        background: none;
        color: var(--muted);
        font-size: 12px;
      }
      label.check {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin: 0 0 12px;
        font-size: 13px;
      }
      .found {
        margin: 0 0 12px;
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--surface);
        color: var(--ink);
      }
      details {
        margin-top: 14px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted);
      }
      input[type="url"] {
        box-sizing: border-box;
        width: 100%;
        margin: 6px 0;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font: inherit;
      }
      .error {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <h1>Importálás a Flavióba</h1>
    <p id="status">Az oldal olvasása…</p>
    <div id="found" class="found" hidden></div>
    <label class="check" id="own-row" hidden>
      <input type="checkbox" id="own" />
      <span id="own-text">Ez a saját vagy az irodám hirdetése.</span>
    </label>
    <button id="import" disabled hidden>Importálás</button>
    <button id="other" class="link" hidden></button>
    <details>
      <summary>Beállítások</summary>
      <label for="crm">A Flavio címe</label>
      <input id="crm" type="url" placeholder="http://localhost:3000" />
      <button id="save" class="link">Mentés</button>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
